<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Fido decoder</title>
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Fido decoder">
    <link rel="icon" href="./images/icon.png" sizes="32x32" />
    <link rel="icon" href="./images/icon192.png" sizes="192x192" />
    <link rel="manifest" href="./app.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="./images/icon192.png">
</head>
<body>
<div class="content">
    <section class="menu">
        <div id="control-panel" class="control-panel minimized">
            <div class="panel-header">
                <!--⛶ ⤭ ◱ 🗖 🗖 -->
                <button id="butInstall" title="install" class="hidden contrl-btn butInstall">↓</button>
                <button id="sound" title="sound" class="contrl-btn hidden js-sound-btn">&#128266;</button>
                <button class="js-help help-btn contrl-btn circled" title="Rules" popovertarget="rulesDialog"></button>
            </div>
            <div class="panel-content"></div>
        </div>
        <div class="video-barcode"></div>
    </section>
    <div class="app">
        <div id="reader"></div>
        <textarea class="input" placeholder="FIDO:/...."></textarea>
        <p class="hexdecoded"></p>
        <p class="cbor"></p>
        <pre class="cbor_decoded"></pre>
    </div>
</div>
<footer>
    <a href="https://cbor.me/">Cbor online decoder</a>
    <div class="log"></div>
</footer>
</body>

</html>
